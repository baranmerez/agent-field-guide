<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{brand}}</title>
<meta name="description" content="{{metaDesc}}">
<!--ALT-LINKS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/*LOGO-CSS*/
/*CSS*/
</style>
<script>
/* Tema tercihi ilk boyamadan önce uygulanır (yanıp sönmeyi önler). */
try{
  var d = document.documentElement, g = function(k){ return JSON.parse(localStorage.getItem("egitim:" + k)); };
  var t = g("theme"), f = g("font"), s = g("fs");
  if (t) d.dataset.theme = t;
  if (f) d.dataset.font = f;
  if (s) d.style.setProperty("--fs", s);
}catch(e){}
</script>
</head>
<body>
<header class="top">
  <div class="top-row">
<!--LOGO-START-->    <span class="logo-plate"><span class="logo" role="img" aria-label="Logo"></span></span><!--LOGO-END-->
    <div class="top-title">{{brand}}<small>{{brandSub}}</small></div>
    <div class="top-spacer"></div>
    <button class="prog" id="progBtn" type="button" title="{{progTitle}}" aria-haspopup="true" aria-expanded="false" aria-controls="progPanel"><span class="prog-ring" id="progRing"></span><span id="progTxt"></span></button>
    <button class="icon-btn" id="glossBtn" type="button">{{glossary}}</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lookPanel" title="{{lookTitle}}">◐ <span class="look-lbl">{{look}}</span></button>
    <a class="icon-btn lang-btn" id="langBtn" href="{{otherHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}" title="{{langOtherTitle}}">{{langOther}}</a>
  </div>
  <div class="pop-panel" id="progPanel" hidden>
    <p class="pp-title">{{progress}}</p>
    <p class="pp-stat" id="progStat"></p>
    <div class="meter" aria-hidden="true"><i id="progMeter" style="width:0;background:var(--ok)"></i></div>
    <p class="hint">{{progHint}}</p>
    <div class="ctrl"><button class="btn ghost sm" id="progReset" type="button">{{progReset}}</button><span class="hint live" id="progMsg" aria-live="polite"></span></div>
  </div>
  <div class="pop-panel look" id="lookPanel" hidden>
    <p class="pp-title">{{theme}}</p>
    <div class="theme-grid" id="themeGrid" role="group" aria-label="{{theme}}"></div>
    <p class="pp-title">{{font}}</p>
    <div class="seg" id="fontSeg" role="group" aria-label="{{font}}">
      <button type="button" data-v="sans">Sans</button><button type="button" data-v="serif">Serif</button><button type="button" data-v="legible">{{fontLegible}}</button>
    </div>
    <p class="pp-title">{{fontSize}}</p>
    <div class="ctrl" style="margin-top:0">
      <div class="seg" role="group" aria-label="{{fontSize}}"><button type="button" id="fsDown" aria-label="{{smaller}}">A−</button><button type="button" id="fsVal" aria-label="{{resetSize}}">100</button><button type="button" id="fsUp" aria-label="{{larger}}">A+</button></div>
    </div>
  </div>
  <nav class="ltabs" id="ltabs" role="tablist" aria-label="{{levelsAria}}"></nav>
</header>

<main id="main">
<!--LEVELS-->
</main>
<!--FOOTER-->

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="gloss" aria-hidden="true" aria-label="{{glossary}}">
  <div class="drawer-head"><h2>{{glossary}}</h2><button class="icon-btn" id="glossClose" type="button">{{close}}</button></div>
  <div class="drawer-body">
    <input class="field" id="glossSearch" type="search" placeholder="{{glossSearch}}" aria-label="{{glossSearchAria}}">
    <div id="glossList"></div>
  </div>
</aside>

<script>
/*I18N*/
</script>
<script>
/*CORE*/
</script>
<!--LEVEL-SCRIPTS-->
<script>
/*APP*/
</script>
</body>
</html>
